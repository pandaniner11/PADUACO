<style>
/* ===================================================================
   1. TOKENS
   =================================================================== */
:root{
  --bg:#0d0d0c;
  --ink:#f2ede4;
  --mute:#a39d92;
  --line:rgba(242,237,228,0.42);
  --gold:#B59410;

  --display-top:6vh;
  --word-h:16vh;
  --veil-h:30vh;

  --veil-fade:96px;
  --copy-top:calc(var(--veil-h) + 6.5rem);
  --gutter:clamp(1.25rem,5vw,5.5rem);
  --measure:min(42ch,34vw);

  --f-display:'Gloock',Georgia,'Times New Roman',serif;
  --f-body:'Inter',system-ui,-apple-system,sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,monospace;
}

*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink)}
html{overflow-x:clip;-webkit-text-size-adjust:100%}
body{
  font-family:var(--f-body);
  font-weight:400;
  line-height:1.5;
  overflow-x:clip;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}
::selection{background:var(--gold);color:#0d0d0c}

.sr-only{
  position:absolute;width:1px;height:1px;padding:0;margin:-1px;
  overflow:hidden;clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap;border:0;
}

/* ===================================================================
   2. STATIC (NO-JS) BASE — the page reads as a long-form article
   =================================================================== */
.defs{position:absolute;width:0;height:0;overflow:hidden}
.display,.veil,.art,.gauge,.measure{display:none}

main{display:block}
.story{
  max-width:46rem;
  margin:0 auto;
  padding:14vh var(--gutter) 10vh;
}
.chapter{margin:0 0 4rem}
.beat{margin:0 0 2.5rem}
.copy p{
  font-size:clamp(1.02rem,1.3vw,1.22rem);
  line-height:1.68;
  color:var(--ink);
  margin:0 0 1.1em;
  max-width:46ch;
}
.opening{
  font-family:var(--f-display);
  font-weight:600;
  font-size:clamp(1.7rem,3.6vw,2.9rem);
  line-height:1.14;
  letter-spacing:-0.02em;
  margin:0 0 1.1rem;
  max-width:22ch;
  overflow-wrap:anywhere;
}
.support{
  font-family:var(--f-body);
  font-size:clamp(0.95rem,1.1vw,1.05rem);
  line-height:1.6;
  color:var(--mute);
  margin:0;
  max-width:38ch;
}
.chapter-label{
  font-family:var(--f-mono);
  font-size:0.72rem;
  font-weight:400;
  letter-spacing:0.22em;
  text-transform:uppercase;
  color:var(--mute);
  margin:0 0 1.4rem;
}
.chapter-label::before{
  content:"";display:block;width:3.5rem;height:1px;
  background:var(--line);margin:0 0 0.9rem;
}
.cue{
  font-family:var(--f-mono);
  font-size:0.68rem;
  letter-spacing:0.24em;
  text-transform:uppercase;
  color:var(--mute);
  margin:2.6rem 0 0;
  display:flex;align-items:center;gap:0.75rem;
  user-select:none;pointer-events:none;
}
.cue-line{display:block;width:2.4rem;height:1px;background:var(--line)}

/* --- outro: return button + legal disclaimer --- */
.outro{margin:7rem 0 0}
.return{
  display:inline-flex;align-items:center;gap:12px;
  font-family:var(--f-body);
  font-size:0.95rem;
  font-weight:500;
  letter-spacing:0.02em;
  color:var(--ink);
  text-decoration:none;
  padding:0.95rem 1.7rem;
  border:1px solid var(--line);
  border-radius:6px;
  transition:border-color .35s ease,color .35s ease,background-color .35s ease;
}
.return:hover{border-color:var(--gold);color:var(--gold)}
.return:focus-visible{outline:2px solid var(--gold);outline-offset:6px}

.legal{
  margin:4.5rem 0 0;
  padding:1.9rem 0 0;
  border-top:1px solid rgba(242,237,228,0.12);
  font-family:var(--f-body);
  font-size:0.8rem;
  line-height:1.75;
  color:rgba(242,237,228,0.46);
  max-width:62ch;
}
.legal p{margin:0 0 0.9rem}
.legal p:last-child{margin:0}
.legal strong{color:rgba(242,237,228,0.72);font-weight:500}
.legal a{color:rgba(242,237,228,0.68);text-decoration:underline;text-underline-offset:2px}
.legal a:hover{color:var(--gold)}
.legal a:focus-visible{outline:2px solid var(--gold);outline-offset:3px}

/* ---- MRA wheel: static base. Without JS this is a plain readable list. ---- */
.wheel-sub{
  font-family:var(--f-display);font-weight:600;
  font-size:clamp(1.3rem,2.4vw,2rem);line-height:1.18;
  letter-spacing:-0.015em;margin:0 0 .5rem;
}
.wheel-q{
  font-family:var(--f-body);font-size:clamp(.92rem,1.1vw,1.02rem);
  color:var(--mute);margin:0;
}
.mra-list{list-style:none;margin:2rem 0 0;padding:0}
.mra-list li{margin:0 0 .35rem}
.mra-item{
  display:flex;flex-wrap:wrap;gap:.2rem .9rem;align-items:baseline;
  width:100%;text-align:left;background:none;border:0;margin:0;
  padding:.35rem 0;color:var(--ink);font-family:var(--f-body);
  font-size:1rem;cursor:pointer;
}
.mra-year{font-weight:500}
.mra-val{color:var(--mute)}
.mra-item:focus-visible{outline:2px solid var(--gold);outline-offset:3px}

.route-list{list-style:none;margin:2rem 0 0;padding:0}
.route-list li{margin:0 0 .35rem}
.route-item{
  display:flex;flex-wrap:wrap;gap:.2rem .9rem;align-items:baseline;
  width:100%;text-align:left;background:none;border:0;margin:0;
  padding:.4rem 0;color:var(--ink);font-family:var(--f-body);
  font-size:1rem;cursor:pointer;
}
.route-n{
  color:var(--gold);font-family:var(--f-mono);
  font-size:.8rem;letter-spacing:.14em;
}
.route-item:focus-visible{outline:2px solid var(--gold);outline-offset:3px}

.cta-wrap{margin:1.6rem 0 0}
.cta{
  display:inline-flex;align-items:center;gap:10px;
  font-family:var(--f-body);font-size:.92rem;font-weight:500;
  color:var(--gold);text-decoration:none;
  padding:.8rem 1.4rem;border:1px solid var(--gold);border-radius:6px;
  transition:background-color .3s ease,color .3s ease;
}
.cta:hover{background:var(--gold);color:#0d0d0c}
.cta:focus-visible{outline:2px solid var(--gold);outline-offset:4px}

.display-cap{display:none}

/* ===================================================================
   3. LIVE LAYOUT — only once the script has started
   =================================================================== */
.live .display,
.live .veil,
.live .art,
.live .gauge{display:block}
.live .measure{display:block}

/* --- fixed display word --- */
.live .display{
  position:fixed;
  top:var(--display-top);
  left:var(--gutter);
  /* NOT ch: ch resolves against this box's inherited 16px font, not the
     display font, which collapsed the column to ~240px. */
  width:min(56vw,56rem);
  height:var(--word-h);
  z-index:4;
  pointer-events:none;
}
.live .display .w{
  position:absolute;
  inset:0;
  font-family:var(--f-display);
  font-weight:600;
  font-size:clamp(2.4rem,7.4vw,6.4rem);
  line-height:1.04;
  letter-spacing:-0.022em;
  color:var(--ink);
  white-space:nowrap;
  will-change:opacity,filter;
}
.live .display.morphing{filter:url(#threshold) blur(0.6px)}

/* hidden twin used to measure the tallest word */
.live .measure{
  position:fixed;
  top:0;left:var(--gutter);
  width:auto;max-width:none;
  white-space:nowrap;
  font-family:var(--f-display);
  font-weight:600;
  font-size:clamp(2.4rem,7.4vw,6.4rem);
  line-height:1.04;
  letter-spacing:-0.022em;
  visibility:hidden;
  pointer-events:none;
  z-index:-1;
}

/* --- veil under the display word --- */
.live .veil{
  position:fixed;
  top:0;left:0;right:0;
  height:calc(var(--veil-h) + var(--veil-fade));
  z-index:3;
  pointer-events:none;
  background:linear-gradient(
    to bottom,
    var(--bg) 0,
    var(--bg) calc(100% - var(--veil-fade)),
    rgba(13,13,12,0.86) calc(100% - var(--veil-fade) * 0.6),
    rgba(13,13,12,0) 100%
  );
}

/* --- artwork --- */
.live .art{
  position:fixed;
  top:var(--veil-h);
  right:clamp(2rem,4vw,4.5rem);
  width:min(44vw,640px);
  height:calc(100vh - var(--veil-h) - 6vh);
  z-index:0;
  pointer-events:none;
  opacity:0;
  transition:opacity .9s ease;
  display:flex;align-items:center;justify-content:center;
}
.live .art.ready{opacity:1}
.live .art-inner{width:100%;height:100%;display:flex;align-items:center;justify-content:center;will-change:transform}
#art-svg{width:100%;height:100%;max-height:100%}

/* --- progress line --- */
.live .gauge{
  position:fixed;
  right:clamp(10px,1.5vw,22px);
  top:26vh;bottom:26vh;
  width:1px;
  background:rgba(242,237,228,0.14);
  z-index:5;
  pointer-events:none;
}
.live .gauge i{
  display:block;width:100%;height:100%;
  background:var(--gold);
  transform:scaleY(0);
  transform-origin:top center;
}

/* --- story column --- */
.live .story{
  max-width:none;
  margin:0;
  padding:0 0 0 var(--gutter);
  width:min(50vw,52rem);
  position:relative;
  z-index:2;
}
.live .chapter{margin:0}
.live .chapter--open{padding-top:30vh}
.live .pin{
  position:sticky;
  top:var(--copy-top);
  max-width:var(--measure);
  padding-bottom:4vh;
}
.live .beat{
  min-height:125vh;
  margin:0;
  display:block;
}
.live .copy{
  position:sticky;
  top:var(--copy-top);
  max-width:var(--measure);
  padding-bottom:3vh;
}
.live .outro{
  padding:22vh 0 18vh;
  max-width:min(62ch,44vw);
}
/* --- endgame: retire the fixed layers so the outro is never covered --- */
.live .display,
.live .gauge{transition:opacity .55s ease}
.live.ending .display,
.live.ending .gauge{opacity:0}
.live.ending .art.ready{opacity:0}

.live .cue{transition:opacity .6s ease}
.live.moved .cue{opacity:0}
.live .cue-line{position:relative;overflow:hidden}
.live .cue-line::after{
  content:"";position:absolute;inset:0;
  background:var(--gold);
  transform:translateX(-100%);
  animation:cue 2.8s cubic-bezier(.6,0,.2,1) infinite;
}
@keyframes cue{
  0%{transform:translateX(-100%)}
  55%{transform:translateX(100%)}
  100%{transform:translateX(100%)}
}

/* ---- MRA wheel: live. The list becomes a radial carousel. ---- */
.live .mra-list{
  position:fixed;
  top:var(--veil-h);
  right:clamp(2rem,4vw,4.5rem);
  width:min(44vw,640px);
  height:calc(100vh - var(--veil-h) - 6vh);
  margin:0;
  z-index:1;
  opacity:0;pointer-events:none;
  transition:opacity .55s ease;
}
.live.wheel-on .mra-list{opacity:1;pointer-events:auto}
.live.wheel-on .art.ready{opacity:0}

/* the ring, and the focal marker on the side that faces the lettering */
.live .mra-list::before{
  content:"";position:absolute;left:50%;top:50%;
  width:var(--wheel-dx,0);height:var(--wheel-dy,0);
  transform:translate(-50%,calc(-50% + var(--wheel-cy,0px)));
  border:1px solid rgba(242,237,228,0.13);border-radius:50%;
}
.live .mra-list li{position:absolute;left:50%;top:50%;margin:0;will-change:transform}
.live .mra-item{
  display:block;white-space:nowrap;width:auto;padding:.3rem .45rem;
  transform-origin:50% 50%;
  font-family:var(--f-mono);
  font-size:clamp(.95rem,1.3vw,1.15rem);
  letter-spacing:.12em;text-transform:uppercase;
  will-change:transform,opacity;
}
.live .mra-item .mra-year{font-weight:400}
.live .mra-item .mra-val{
  position:absolute;width:1px;height:1px;padding:0;margin:-1px;
  overflow:hidden;clip-path:inset(50%);white-space:nowrap;
}
.live .mra-item[aria-current="true"] .mra-year{color:var(--gold)}
.live .beat--wheel{min-height:340vh}

/* ---- Qualifying routes: three overlapping circles ---- */
.live .route-list{
  position:fixed;
  top:var(--veil-h);
  right:clamp(2rem,4vw,4.5rem);
  width:min(44vw,640px);
  height:calc(100vh - var(--veil-h) - 6vh);
  margin:0;z-index:1;
  opacity:0;pointer-events:none;
  transition:opacity .55s ease;
}
.live.rings-on .route-list{opacity:1;pointer-events:auto}
.live.rings-on .art.ready{opacity:0}
.live .route-list li{position:absolute;left:50%;top:50%;margin:0;will-change:transform}
.live .route-item{
  display:flex;align-items:center;justify-content:center;
  width:var(--ring-d,200px);height:var(--ring-d,200px);
  padding:0;border:1px solid var(--line);border-radius:50%;
  transform-origin:50% 50%;
  will-change:transform,opacity;
}
.live .route-item .route-text{
  position:absolute;width:1px;height:1px;padding:0;margin:-1px;
  overflow:hidden;clip-path:inset(50%);white-space:nowrap;
}
.live .route-item .route-n{
  font-size:clamp(.85rem,1.2vw,1.05rem);letter-spacing:.16em;
  color:var(--mute);
}
.live .route-item[aria-current="true"]{border-color:var(--gold)}
.live .route-item[aria-current="true"] .route-n{color:var(--gold)}
.live .beat--rings{min-height:260vh}

/* "Your MRA is" caption above the big answer */
.live .display-cap{
  display:block;position:fixed;
  top:calc(var(--display-top) - 1.45rem);
  left:var(--gutter);
  font-family:var(--f-mono);font-size:.68rem;letter-spacing:.24em;
  text-transform:uppercase;color:var(--gold);
  opacity:0;transition:opacity .4s ease;
  z-index:4;pointer-events:none;
}
.live.wheel-on .display-cap,
.live.rings-on .display-cap{opacity:1}

/* ===================================================================
   4. ARTWORK STROKES
   =================================================================== */
#art-svg [data-layer] path,
#art-svg [data-layer] circle,
#art-svg [data-layer] line{
  fill:none;
  stroke:var(--line);
  stroke-width:1.6;
  stroke-linecap:round;
  stroke-linejoin:round;
}
#art-svg .l-gold path,
#art-svg .l-gold circle{stroke:var(--gold)}
#art-svg .dash{
  stroke:rgba(242,237,228,0.2);
  stroke-dasharray:5 11;
  stroke-width:1.2;
}
#art-svg text.label{
  font-family:var(--f-mono);
  font-size:17px;
  letter-spacing:0.16em;
  fill:var(--mute);
  stroke:none;
  text-anchor:middle;
}
#art-svg .fade{opacity:0}
#art-svg .dot{fill:var(--gold);stroke:none}

/* ===================================================================
   5. NARROW SCREENS
   =================================================================== */
@media (max-width:899px){
  :root{--veil-fade:48px;--copy-top:calc(var(--veil-h) + 3.6rem)}
  .live .story{width:100%;padding:0 var(--gutter)}
  .live .display{left:var(--gutter);right:var(--gutter);width:auto}
  .live .measure{left:var(--gutter);right:var(--gutter);width:auto}
  .live .display .w{font-size:clamp(2rem,10.5vw,3.6rem);letter-spacing:-0.018em}
  .live .measure{font-size:clamp(2rem,10.5vw,3.6rem)}
  .live .art{
    top:0;right:0;left:0;
    width:100%;height:100vh;
    opacity:0;
  }
  .live .art.ready{opacity:0.13}
  #art-svg{width:118vw;max-width:none;height:auto}
  .live .pin,
  .live .copy{
    max-width:none;
    background:rgba(13,13,12,0.88);
    border:1px solid rgba(242,237,228,0.07);
    border-radius:6px;
    padding:1.15rem 1.15rem 1.3rem;
    backdrop-filter:blur(3px);
    -webkit-backdrop-filter:blur(3px);
  }
  .live .beat{min-height:112vh}
  .live .beat--wheel{min-height:300vh}
  .live .beat--rings{min-height:240vh}
  .live .mra-list,
  .live .route-list{left:0;right:0;width:100%}
  .live .mra-item{font-size:.82rem;letter-spacing:.08em}
  .live .gauge{top:18vh;bottom:18vh}
  .live .outro{max-width:none}
  .copy p{max-width:none}
  .opening{max-width:none}
}

/* ===================================================================
   6. REDUCED MOTION
   =================================================================== */
@media (prefers-reduced-motion:reduce){
  *{animation-duration:0.001ms !important;animation-iteration-count:1 !important;transition-duration:0.001ms !important}
}
.reduced .cue-line::after{display:none}
.reduced #art-svg .fade{opacity:1}
.reduced .live .art{transition:none}
</style>
</head>

        wIn.style.opacity  = '1'; wIn.style.filter  = 'none';

        b = (o.startAt + (o.duration || 0)) / fl;
        if (!r[n]) r[n] = { from: a, to: b };

      }
      segs.forEach(function (s, i) {           /* fallback: even split */

      return true;
    }

    /* ---------------- qualifying routes ----------------
       Three overlapping circles turning as one cluster. The route at
       the focal point comes forward, goes gold and fills the lettering. */
    function paintRings(){
      if (!routeN || !ringStage) return false;
      var p = stageProgress(ringStage), on = p >= 0 && stageCopyStuck(ringStage);
      document.body.classList.toggle('rings-on', on);
      if (!on) { routeAct = -1; return false; }

      var narrow = window.innerWidth < 900,
          w = routeList.clientWidth,
          h = routeList.clientHeight,
          R = Math.max(80, Math.min(w, h) * 0.5),
          grow = 0.88 + 0.18 * p,               /* the cluster grows as you go */
          ringD = R * 0.86 * grow,
          orbit = R * 0.40 * grow,
          focal = narrow ? -Math.PI / 2 : Math.PI,
          step = (Math.PI * 2) / routeN,
          off  = -(p * (routeN - 1)) * step,
          act  = Math.round(p * (routeN - 1));

      routeList.style.setProperty('--ring-d', ringD.toFixed(1) + 'px');

      for (var i = 0; i < routeN; i++) {
        var rel = i * step + off,
            dAng = Math.abs(Math.atan2(Math.sin(rel), Math.cos(rel))),
            th = focal + rel,
            x = Math.cos(th) * orbit,
            y = Math.sin(th) * orbit,
            near = 1 - dAng / Math.PI,
            sc = 0.72 + 0.55 * near * near,
            op = 0.30 + 0.70 * Math.pow(near, 1.8);
        routeItems[i].parentNode.style.transform =
          'translate(' + x.toFixed(1) + 'px,' + y.toFixed(1) + 'px)';
        routeItems[i].parentNode.style.zIndex = (i === act) ? '2' : '1';
        routeItems[i].style.transform = 'translate(-50%,-50%) scale(' + sc.toFixed(3) + ')';
        routeItems[i].style.opacity = op.toFixed(3);
        routeItems[i].setAttribute('aria-current', i === act ? 'true' : 'false');
      }

      if (act !== routeAct) {
        routeAct = act;
        setStageWord(routeItems[act].getAttribute('data-val') || '',
                     routeItems[act].getAttribute('data-n') || '');
      }
      return true;
    }

    wheelItems.forEach(function (btn, i) {
      btn.addEventListener('click', function () { stageGoTo(wheelStage, i, wheelN); });
      btn.addEventListener('focus', function () { stageGoTo(wheelStage, i, wheelN); });
    });
    routeItems.forEach(function (btn, i) {
      btn.addEventListener('click', function () { stageGoTo(ringStage, i, routeN); });
      btn.addEventListener('focus', function () { stageGoTo(ringStage, i, routeN); });
    });

    /* ---------------- endgame ---------------- */
    /* The display word, artwork and gauge are position:fixed. The outro is not,
       so without this it scrolls up underneath them. Reverses on scroll up. */
    function endingCheck(){
      if (!outro) return;
      var top = outro.getBoundingClientRect().top;
      document.body.classList.toggle('ending', top < window.innerHeight * 0.72);
    }

    /* ---------------- paint ---------------- */
    function paint(t){
      var wheelOn = paintWheel(),
          ringsOn = paintRings();

      if (!wheelOn && !ringsOn) {
        var i = Math.min(Math.floor(t), lastI),
            a = words[i],
            b = words[Math.min(i + 1, lastI)],
            f = settle ? settle.v : morphF(t);

        if (a === b) f = 0;
        else if (reduced) f = f < 0.5 ? 0 : 1;
        else if (Math.abs(i - prevI) > 1) f = f < 0.5 ? 0 : 1;   /* big jump: one word at most */
        prevI = i;

        if (fontPx.length) {
          wOut.style.fontSize = fontPx[i] + 'px';
          wIn.style.fontSize  = fontPx[Math.min(i + 1, lastI)] + 'px';
        }
        setWord(a, b, f);
      }

      var prog = lastI ? t / lastI : 0;
      bar.style.transform = 'scaleY(' + prog.toFixed(4) + ')';
      artInner.style.transform = 'scale(' + (0.94 + 0.08 * prog).toFixed(4) + ')';
      document.body.classList.toggle('moved', t > 0.25);
      endingCheck();

      if (vivus && ranges && !reduced) {
        try { vivus.setFrameProgress(artProgress(t)); } catch (e) {}
        paintFades(t);
      }
    }

    /* ---------------- loop ---------------- */
    function frame(){
      queued = false;
      if (settle) {
        settle.v += (settle.to - settle.v) * 0.14;
        if (Math.abs(settle.to - settle.v) < 0.004) { settle.v = settle.to; paint(tRaw); settle = null; return; }
        paint(tRaw);
        request();
        return;
      }
      tRaw = beatPosition();
      paint(tRaw);
    }
    function request(){
      if (!queued) { queued = true; window.requestAnimationFrame(frame); }
    }
    function onIdle(){
      if (reduced) return;
      var f = morphF(tRaw);
      if (f > 0.002 && f < 0.998) { settle = { v: f, to: f < 0.5 ? 0 : 1 }; request(); }
    }

    /* ---------------- wire up ---------------- */
    document.body.classList.add('live');
    measure();
    tRaw = beatPosition();
    paint(tRaw);

    window.addEventListener('scroll', function () {
      settle = null;
      if (idleT) clearTimeout(idleT);
      idleT = setTimeout(onIdle, 160);
      request();
    }, { passive: true });

    var rT = null;
    window.addEventListener('resize', function () {
      if (rT) clearTimeout(rT);
      rT = setTimeout(function () { measure(); tRaw = beatPosition(); paint(tRaw); }, 140);
    }, { passive: true });

    if (document.fonts && document.fonts.ready && document.fonts.ready.then) {
      document.fonts.ready.then(function () { measure(); paint(beatPosition()); });
    }

    /* ---------------- Vivus ---------------- */
    function artStatic(){
      var all = document.querySelectorAll('#art-svg .fade');
      for (var i = 0; i < all.length; i++) all[i].style.opacity = '1';
      art.classList.add('ready');
    }

    var s = document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/vivus/0.4.6/vivus.min.js';
    s.async = true;
    s.onerror = artStatic;
    s.onload = function () {
      try {
        vivus = new Vivus('art-svg', {
          type: 'oneByOne',
          start: 'manual',
          duration: 400,
          animTimingFunction: Vivus.LINEAR,
          pathTimingFunction: Vivus.LINEAR
        });
        ranges = layerRanges();
        fades = Array.prototype.slice.call(document.querySelectorAll('#art-svg .fade'));
        if (reduced) {
          vivus.setFrameProgress(1);
          for (var i = 0; i < fades.length; i++) fades[i].style.opacity = '1';
        } else {
          vivus.setFrameProgress(artProgress(tRaw));
          paintFades(tRaw);
        }
        art.classList.add('ready');
        paint(tRaw);
      } catch (e) {
        artStatic();
      }
    };
    document.head.appendChild(s);
  }
})();
</script>

</body>
</html>
